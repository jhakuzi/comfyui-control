name: Build and publish to COPR

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the source RPM to jhakuzi/comfyui-control
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: copr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 90
    steps:
      - name: Install packaging tools
        run: dnf -y install git python3 rpm-build copr-cli dnf5-plugins

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check version tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Tag must match app version: expected {expected}')
          PY

      - name: Build source RPM and app ZIP
        run: |
          python3 packaging/make_srpm.py --outdir dist
          python3 packaging/make_app_zip.py --outdir dist

      - name: Install declared build dependencies
        run: dnf -y builddep packaging/comfyui-control.spec

      - name: Build and test the RPM
        run: |
          rpmbuild --define '_topdir /tmp/comfyui-control-rpmbuild' --rebuild dist/*.src.rpm
          cp /tmp/comfyui-control-rpmbuild/RPMS/noarch/*.rpm dist/

      - name: Save downloads
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: comfyui-control-downloads
          path: |
            dist/*.src.rpm
            dist/comfyui-control.zip
            dist/*.noarch.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Submit to COPR and wait for build results
        if: github.event_name == 'push' || inputs.publish
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          python3 - <<'PY'
          import configparser
          import os
          import re
          import subprocess
          import tempfile
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:rc[1-9][0-9]*)?', version):
              raise SystemExit('Only stable releases and explicitly versioned release candidates may be published to COPR.')
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['GITHUB_REF_NAME'] != 'main':
              raise SystemExit('Manual stable COPR publishing is allowed only from main.')
          login, token = os.environ['COPR_LOGIN'], os.environ['COPR_TOKEN']
          if not login or not token:
              raise SystemExit('Add COPR_LOGIN and COPR_TOKEN in repository Settings > Secrets and variables > Actions.')
          rpms = list(Path('dist').glob('*.src.rpm'))
          if len(rpms) != 1:
              raise SystemExit('Expected exactly one source RPM')
          config = configparser.ConfigParser(interpolation=None)
          config['copr-cli'] = {
              'copr_url': 'https://copr.fedorainfracloud.org',
              'username': 'jhakuzi',
              'login': login,
              'token': token,
          }
          with tempfile.TemporaryDirectory() as temporary:
              path = Path(temporary) / 'copr'
              with open(path, 'x', opener=lambda name, flags: os.open(name, flags, 0o600)) as output:
                  config.write(output)
              subprocess.run([
                  'copr-cli', '--config', str(path), 'build',
                  'jhakuzi/comfyui-control', str(rpms[0]),
              ], check=True)
          PY
