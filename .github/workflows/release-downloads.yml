name: Publish release downloads

on:
  push:
    branches: [main]
    paths: ['docs/releases/publish.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Stable or release candidate tag with an existing GitHub release draft
        required: true
        type: string
      build_run:
        description: Successful tag or main packaging build/COPR run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-downloads-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run }}
    steps:
      - name: Read reviewed publication request
        if: github.event_name == 'push'
        run: |
          python3 - <<'PYCODE'
          import base64, json, os, re, subprocess
          repo, sha = os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          response = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/contents/docs/releases/publish.json?ref={sha}']))
          request = json.loads(base64.b64decode(response['content']))
          tag, run = request['tag'], str(request['build_run'])
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:rc[1-9][0-9]*)?', tag) or not run.isdecimal():
              raise SystemExit('Invalid reviewed publication request.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG={tag}\nBUILD_RUN_ID={run}\n')
          PYCODE

      - name: Verify successful release build and matching tag
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo, tag, run_id = (os.environ[k] for k in ('GH_REPO', 'RELEASE_TAG', 'BUILD_RUN_ID'))
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:rc[1-9][0-9]*)?', tag) or not run_id.isdecimal():
              raise SystemExit('Choose a stable or release candidate tag and numeric build run ID.')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          run = api(f'actions/runs/{run_id}')
          if run['conclusion'] != 'success' or run['path'] != '.github/workflows/copr.yml':
              raise SystemExit('Choose a successful Build and publish to COPR run.')
          tagged = run['event'] == 'push' and run['head_branch'] == tag
          packaging = run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          if not (tagged or packaging):
              raise SystemExit('Choose a stable tag build or a packaging build from main.')
          jobs = api(f'actions/runs/{run_id}/jobs')['jobs']
          if not any(step['name'] == 'Submit to COPR and wait for build results'
                     and step['conclusion'] == 'success' for job in jobs for step in job['steps']):
              raise SystemExit('The selected run must include successful COPR publication.')
          ref = api(f'git/ref/tags/{tag}')['object']
          if ref['type'] == 'tag':
              ref = api('git/tags/' + ref['sha'])['object']
          if ref['type'] != 'commit':
              raise SystemExit('The release tag must resolve to a commit.')
          if tagged and ref['sha'] != run['head_sha']:
              raise SystemExit('The build commit does not match this release tag.')
          if packaging and api(f"compare/{ref['sha']}...{run['head_sha']}")['status'] not in ('ahead', 'identical'):
              raise SystemExit('The packaging build must descend from the release tag.')
          # Create a draft only after the tag and successful COPR run are verified.
          existing = subprocess.run(['gh', 'release', 'view', tag], stdout=subprocess.DEVNULL)
          if existing.returncode:
              import base64
              notes = api(f'contents/docs/releases/{tag.removeprefix("v")}.md?ref={tag}')
              from pathlib import Path
              path = Path('release-notes.md')
              path.write_text(base64.b64decode(notes['content']).decode('utf-8') +
                  '\n## Install or update\n\nFedora COPR:\n\n```bash\n'
                  'sudo dnf copr enable jhakuzi/comfyui-control\n'
                  'sudo dnf install --refresh comfyui-control\n'
                  '# Already installed:\n'
                  'sudo dnf upgrade --refresh comfyui-control\n```\n\n'
                  'For ZIP installation, extract `comfyui-control.zip` and run '
                  '`bash install.sh` as your normal user. Restart the app and reload WebUI pages.\n')
              subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--draft',
                              '--title', f'ComfyUI Control {tag.removeprefix("v")}',
                              '--notes-file', str(path)], check=True)
          PY

      - name: Download verified build artifacts
        run: gh run download "$BUILD_RUN_ID" --name comfyui-control-downloads --dir release-downloads

      - name: Attach packages and publish the release
        run: |
          python3 - <<'PY'
          import base64, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          repo, tag = os.environ['GH_REPO'], os.environ['RELEASE_TAG']
          files = sorted(Path('release-downloads').iterdir())
          version = tag.removeprefix('v')
          candidate = re.fullmatch(r'([0-9]+\.[0-9]+\.[0-9]+)rc([1-9][0-9]*)', version)
          rpm_version = f'{candidate[1]}~rc{candidate[2]}' if candidate else version
          if len(files) != 3 or not all(p.is_file() and (
                  p.name == 'comfyui-control.zip' or p.name.startswith(f'comfyui-control-{rpm_version}-')
                  and p.name.endswith(('.src.rpm', '.noarch.rpm'))) for p in files):
              raise SystemExit('Expected only the matching app ZIP, source RPM and binary RPM.')
          tracked = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repo}/contents/downloads/comfyui-control.zip?ref={tag}']))
          # Deflate output can vary across build environments. Verify the files
          # and their permissions rather than requiring identical compression.
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(tracked['content']))) as expected, zipfile.ZipFile(
                  'release-downloads/comfyui-control.zip') as actual:
              if actual.namelist() != expected.namelist():
                  raise SystemExit('The build ZIP file list differs from the release tag.')
              for name in expected.namelist():
                  if (actual.getinfo(name).external_attr != expected.getinfo(name).external_attr
                          or actual.read(name) != expected.read(name)):
                      raise SystemExit(f'The build ZIP differs from the release tag: {name}')
          print('ZIP contents and permissions match the release tag.')
          subprocess.run(['gh', 'release', 'upload', tag, *map(str, files), '--clobber'], check=True)
          flags = ['--prerelease', '--latest=false'] if candidate else ['--prerelease=false', '--latest']
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', *flags], check=True)
          PY
